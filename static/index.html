<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>YouTube to MP3</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <main>
      <header><h1>YouTube to MP3</h1><span id="connection" role="status">Connecting…</span></header>
      <section class="converter" aria-label="Convert a YouTube video">
        <form id="convert-form">
          <label for="url">YouTube link</label>
          <input id="url" name="url" type="url" placeholder="https://www.youtube.com/watch?v=…" required maxlength="2048" autocomplete="off">
          <div class="form-bottom"><div><label for="bitrate">MP3 bitrate</label><select id="bitrate" name="bitrate"><option value="128">128 kbps</option><option value="192" selected>192 kbps</option><option value="320">320 kbps</option></select></div><button id="submit" type="submit">Convert</button></div>
          <p id="form-error" class="error" role="alert" hidden></p>
        </form>
      </section>
      <section class="queue" aria-labelledby="queue-heading"><div class="queue-heading"><h2 id="queue-heading">Conversions <span id="count">0</span></h2><span>Files kept for 24 hours</span></div><p id="queue-error" class="error" role="status" hidden></p><div id="jobs"><p class="empty">No conversions yet.</p></div></section>
    </main>
  </div>
  <template id="job-template"><article class="job"><div class="job-top"><div class="job-text"><span class="job-status"></span><h3></h3><p class="job-meta"></p></div><div class="job-actions"></div></div><progress max="100" aria-label="Conversion progress"></progress><p class="job-error error" hidden></p></article></template>
</body>
</html>
